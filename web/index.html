<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judge the Model — LCARS</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Ship blueprint background (covers everything; panels sit on top) -->
  <div class="ship-blueprint">
    <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1a1a1a"/>
          <stop offset="100%" stop-color="#050505"/>
        </linearGradient>
      </defs>
      <rect width="900" height="420" fill="url(#shipGrad)"/>
      <!-- Saucer section -->
      <ellipse cx="450" cy="200" rx="260" ry="62" fill="none" stroke="#4a4a4a" stroke-width="3" opacity="0.7"/>
      <ellipse cx="450" cy="200" rx="240" ry="48" fill="none" stroke="#3a3a3a" stroke-width="1" opacity="0.5"/>
      <!-- Engineering hull -->
      <path d="M330 200 L330 300 Q450 340 570 300 L570 200 Q450 160 330 200" fill="none" stroke="#4a4a4a" stroke-width="3" opacity="0.7"/>
      <!-- Nacelles -->
      <rect x="160" y="240" width="70" height="42" rx="10" fill="none" stroke="#4a4a4a" stroke-width="3" opacity="0.7"/>
      <rect x="670" y="240" width="70" height="42" rx="10" fill="none" stroke="#4a4a4a" stroke-width="3" opacity="0.7"/>
      <!-- Nacelle caps -->
      <rect x="150" y="240" width="12" height="42" rx="4" fill="#2a2a2a" opacity="0.8"/>
      <rect x="730" y="240" width="12" height="42" rx="4" fill="#2a2a2a" opacity="0.8"/>
      <!-- Pylons -->
      <line x1="330" y1="240" x2="230" y2="260" stroke="#4a4a4a" stroke-width="5" opacity="0.7"/>
      <line x1="570" y1="240" x2="670" y2="260" stroke="#4a4a4a" stroke-width="5" opacity="0.7"/>
      <!-- Bridge module -->
      <circle cx="450" cy="155" r="18" fill="none" stroke="#4a4a4a" stroke-width="3" opacity="0.7"/>
      <!-- Registry -->
      <text x="450" y="335" font-family="Courier New, Courier, monospace" font-size="16" fill="#3a3a3a" text-anchor="middle" letter-spacing="2" opacity="0.7">NCC-1701-D</text>
      <!-- Deck lines -->
      <line x1="190" y1="200" x2="710" y2="200" stroke="#3a3a3a" stroke-width="2" opacity="0.6"/>
      <line x1="190" y1="185" x2="710" y2="185" stroke="#3a3a3a" stroke-width="1" opacity="0.4"/>
      <line x1="190" y1="215" x2="710" y2="215" stroke="#3a3a3a" stroke-width="1" opacity="0.4"/>
    </svg>
  </div>

  <div class="lcars-app">
    <!-- Top command bar -->
    <header class="lcars-top-bar">
      <div class="lcars-station-tag">LCARS</div>
      <div class="lcars-ship-id">U.S.S. ENTERPRISE NCC-1701-D</div>
      <div class="lcars-status">STANDING BY</div>
    </header>

    <div class="lcars-body">
      <!-- Left column: control stations -->
      <aside class="lcars-sidebar">
        <div class="lcars-station">
          <div class="lcars-station-header">SECTION</div>
          <select id="section-select"></select>
        </div>
        <div class="lcars-station">
          <div class="lcars-station-header">DATA SET</div>
          <select id="dataset"></select>
        </div>
        <div class="lcars-station">
          <div class="lcars-station-header">MODEL</div>
          <select id="model"></select>
        </div>
        <div class="lcars-station">
          <div class="lcars-station-header">TELEMETRY</div>
          <canvas class="lcars-widget" id="lcars-canvas" width="220" height="130"></canvas>
        </div>
      </aside>

      <!-- Main content panel -->
      <main class="lcars-main">
        <section class="lcars-panel rec-panel" id="recommendations" aria-labelledby="rec-h">
          <div class="lcars-panel-header">RECOMMENDATIONS</div>
          <h2 id="rec-h">Recommendations</h2>
        </section>
        <div class="lcars-spacer"></div>
        <div class="lcars-panel content-panel">
          <div class="lcars-panel-header" id="section-title"></div>
          <p class="caption" id="context"></p>
          <div id="content"><p>Loading results…</p></div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
